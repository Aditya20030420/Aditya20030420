<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 52" width="880" height="52" fill="none" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1620"/><stop offset="1" stop-color="#0b1017"/></linearGradient>
  <linearGradient id="pscan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="pc"><rect x="1" y="1" width="878" height="50" rx="12"/></clipPath>
  <style>.cname{font-size:14px;font-weight:700;fill:#e6edf3}.cmeta{font-size:12px;fill:#8b949e}.cch{font-size:10.5px;font-weight:600;fill:#fff}.sw{animation:sw 9s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-360px)}55%,100%{transform:translateX(620px)}}</style>
