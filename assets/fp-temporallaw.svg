<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 74" width="880" height="74" fill="none" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1620"/><stop offset="1" stop-color="#0b1017"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F6FEB"/><stop offset="1" stop-color="#58A6FF"/></linearGradient>
  <linearGradient id="pscan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="rTop" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1F6FEB" stop-opacity="0.22"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
  <filter id="bg" x="-10%" y="-500%" width="120%" height="1100%"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="pc"><rect x="1" y="1" width="878" height="72" rx="14"/></clipPath>
  <style>
    .ttl{font-size:18px;font-weight:700;fill:#e6edf3}
    .sub{font-size:14px;fill:#9aa7b4}
    .chip{font-size:11.5px;font-weight:700;fill:#fff}
    .sw{animation:sw 8s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-380px)}55%,100%{transform:translateX(600px)}}
    .tg{animation:tg 5s ease-in-out infinite}@keyframes tg{0%,100%{opacity:.5}50%{opacity:.9}}
  </style>
</defs>
<rect x="1" y="1" width="878" height="72" rx="14" fill="url(#pbg)" stroke="#233041"/>
<g clip-path="url(#pc)">
  <ellipse class="tg" cx="220" cy="4" rx="360" ry="52" fill="url(#rTop)"/>
  <rect class="sw" x="0" y="0" width="150" height="74" fill="url(#pscan)"/>
  <rect x="1" y="1" width="878" height="3.5" fill="url(#acc)" filter="url(#bg)"/>
  <rect x="1" y="1" width="878" height="3.5" fill="url(#acc)"/>
</g>
<g transform="translate(24,13)"><line x1="12" y1="3.5" x2="12" y2="20" stroke="#4F9EE8" stroke-width="1.8"/><line x1="4" y1="7" x2="20" y2="7" stroke="#4F9EE8" stroke-width="1.8"/><circle cx="12" cy="4" r="1.6" fill="#4F9EE8"/><path d="M4 7 L1.5 12.5 a3 3 0 0 0 5 0 Z" fill="none" stroke="#4F9EE8" stroke-width="1.5"/><path d="M20 7 L17.5 12.5 a3 3 0 0 0 5 0 Z" fill="none" stroke="#4F9EE8" stroke-width="1.5"/><line x1="8" y1="20.5" x2="16" y2="20.5" stroke="#4F9EE8" stroke-width="1.8" stroke-linecap="round"/></g>
<text class="ttl" x="58" y="30">TemporalLaw-AI</text>
<text class="sub" x="208" y="30">— Time-Aware Legal Assistant</text>
