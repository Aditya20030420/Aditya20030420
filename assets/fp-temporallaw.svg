<g transform="translate(107,46)"><rect width="106" height="20" rx="6" fill="#4F9EE8" fill-opacity="0.18" stroke="#4F9EE8" stroke-opacity="0.55"/><text class="chip" x="53.0" y="14" text-anchor="middle">Hybrid Retrieval</text></g>
<g transform="translate(220,46)"><rect width="76" height="20" rx="6" fill="#4F9EE8" fill-opacity="0.18" stroke="#4F9EE8" stroke-opacity="0.55"/><text class="chip" x="38.0" y="14" text-anchor="middle">ChromaDB</text></g>
<g transform="translate(303,46)"><rect width="50" height="20" rx="6" fill="#4F9EE8" fill-opacity="0.18" stroke="#4F9EE8" stroke-opacity="0.55"/><text class="chip" x="25.0" y="14" text-anchor="middle">BM25</text></g>
<g transform="translate(360,46)"><rect width="67" height="20" rx="6" fill="#4F9EE8" fill-opacity="0.18" stroke="#4F9EE8" stroke-opacity="0.55"/><text class="chip" x="33.5" y="14" text-anchor="middle">Streamlit</text></g>
</svg>