<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" fill="none" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1620"/><stop offset="1" stop-color="#0b1017"/></linearGradient>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F6FEB"/><stop offset="1" stop-color="#58A6FF"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E7490"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E7D32"/><stop offset="1" stop-color="#4ADE80"/></linearGradient>
  <radialGradient id="rBlue" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1F6FEB" stop-opacity="0.55"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
  <radialGradient id="rTeal" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <radialGradient id="rGreen" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4ADE80" stop-opacity="0.5"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="barglow" x="-20%" y="-400%" width="140%" height="900%"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="c1"><rect x="20"  y="40" width="280" height="240" rx="16"/></clipPath>
  <clipPath id="c2"><rect x="320" y="40" width="280" height="240" rx="16"/></clipPath>
  <clipPath id="c3"><rect x="620" y="40" width="280" height="240" rx="16"/></clipPath>
  <style>
    text{fill:#e6edf3}
    .sub{fill:#9aa7b4;font-size:12.5px}
    .ttl{font-size:19px;font-weight:700}
    .chip{font-size:11px;font-weight:700}
    .lnk{font-size:12.5px;font-weight:700}
    .glow{animation:pulse 3.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
    .cglow{animation:cpulse 5s ease-in-out infinite}
    @keyframes cpulse{0%,100%{opacity:.5}50%{opacity:.9}}
    .cg2{animation-delay:.6s}.cg3{animation-delay:1.2s}
    .sweep{animation:sweep 6.5s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-320px)}55%,100%{transform:translateX(320px)}}
    .sweep2{animation-delay:.6s}.sweep3{animation-delay:1.2s}
    .flow{stroke-dasharray:4 8;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .arr{animation:nudge 1.9s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
  </style>
</defs>

<!-- ===== CARD 1 : RAG & LLM ===== -->
<g>
  <rect x="20" y="40" width="280" height="240" rx="16" fill="url(#panel)" stroke="#233041"/>
  <g clip-path="url(#c1)">
    <ellipse class="cglow" cx="150" cy="70" rx="150" ry="90" fill="url(#rBlue)" opacity="0.5"/>
    <rect class="sweep" x="20" y="40" width="120" height="240" fill="url(#scan)"/>
  </g>
  <rect x="20" y="40" width="280" height="3.5" fill="url(#gBlue)" filter="url(#barglow)"/>
  <rect x="20" y="40" width="280" height="3.5" rx="2" fill="url(#gBlue)"/>
  <g transform="translate(52,86)">
    <circle class="glow" cx="16" cy="16" r="21" fill="#1F6FEB" filter="url(#soft)" opacity="0.55"/>
    <line class="flow" x1="6" y1="6" x2="26" y2="16" stroke="#58A6FF" stroke-width="1.6"/>
    <line class="flow" x1="6" y1="26" x2="26" y2="16" stroke="#58A6FF" stroke-width="1.6"/>
    <line class="flow" x1="6" y1="6" x2="6" y2="26" stroke="#58A6FF" stroke-width="1.6"/>
    <circle cx="6" cy="6" r="3.4" fill="#58A6FF"/><circle cx="6" cy="26" r="3.4" fill="#58A6FF"/><circle cx="26" cy="16" r="4" fill="#fff"/>
  </g>
  <text class="ttl" x="52" y="150">RAG &amp; LLM Apps</text>
  <text class="sub" x="52" y="172">Hybrid semantic + keyword</text>
  <text class="sub" x="52" y="189">retrieval, grounded answers</text>
  <g transform="translate(52,208)">
    <g transform="translate(0,0)"><rect width="46" height="20" rx="6" fill="#1F6FEB" opacity="0.16" stroke="#1F6FEB" stroke-opacity="0.55"/><text class="chip" x="23" y="14" text-anchor="middle" fill="#8EC1FF">RAG</text></g>
    <g transform="translate(52,0)"><rect width="78" height="20" rx="6" fill="#1F6FEB" opacity="0.16" stroke="#1F6FEB" stroke-opacity="0.55"/><text class="chip" x="39" y="14" text-anchor="middle" fill="#8EC1FF">ChromaDB</text></g>
    <g transform="translate(136,0)"><rect width="52" height="20" rx="6" fill="#1F6FEB" opacity="0.16" stroke="#1F6FEB" stroke-opacity="0.55"/><text class="chip" x="26" y="14" text-anchor="middle" fill="#8EC1FF">BM25</text></g>
  </g>
  <text class="lnk" x="52" y="256" fill="#58A6FF">TemporalLaw-AI</text>
  <text class="lnk arr" x="150" y="256" fill="#58A6FF">→</text>
</g>

<!-- ===== CARD 2 : DOCUMENT INTELLIGENCE ===== -->
<g>
  <rect x="320" y="40" width="280" height="240" rx="16" fill="url(#panel)" stroke="#233041"/>
  <g clip-path="url(#c2)">
    <ellipse class="cglow cg2" cx="450" cy="70" rx="150" ry="90" fill="url(#rTeal)" opacity="0.5"/>
    <rect class="sweep sweep2" x="320" y="40" width="120" height="240" fill="url(#scan)"/>
  </g>
  <rect x="320" y="40" width="280" height="3.5" fill="url(#gTeal)" filter="url(#barglow)"/>
  <rect x="320" y="40" width="280" height="3.5" rx="2" fill="url(#gTeal)"/>
  <g transform="translate(352,84)">
    <circle class="glow" cx="16" cy="18" r="21" fill="#0E7490" filter="url(#soft)" opacity="0.55"/>
    <path d="M4 2 h16 l8 8 v24 a2 2 0 0 1 -2 2 H4 a2 2 0 0 1 -2 -2 V4 a2 2 0 0 1 2 -2 z" fill="#0b1017" stroke="#22D3EE" stroke-width="1.6"/>
    <path d="M20 2 v8 h8" fill="none" stroke="#22D3EE" stroke-width="1.6"/>
    <line class="flow" x1="7" y1="18" x2="23" y2="18" stroke="#22D3EE" stroke-width="1.6"/>
    <line class="flow" x1="7" y1="25" x2="23" y2="25" stroke="#22D3EE" stroke-width="1.6"/>
  </g>
  <text class="ttl" x="352" y="150">Document Intelligence</text>
  <text class="sub" x="352" y="172">OCR extraction pipelines for</text>
  <text class="sub" x="352" y="189">real-world, scanned PDFs</text>
  <g transform="translate(352,208)">
    <g transform="translate(0,0)"><rect width="94" height="20" rx="6" fill="#0E7490" opacity="0.2" stroke="#22D3EE" stroke-opacity="0.55"/><text class="chip" x="47" y="14" text-anchor="middle" fill="#7FE9F5">Tesseract OCR</text></g>
    <g transform="translate(100,0)"><rect width="46" height="20" rx="6" fill="#0E7490" opacity="0.2" stroke="#22D3EE" stroke-opacity="0.55"/><text class="chip" x="23" y="14" text-anchor="middle" fill="#7FE9F5">Flask</text></g>
    <g transform="translate(152,0)"><rect width="52" height="20" rx="6" fill="#0E7490" opacity="0.2" stroke="#22D3EE" stroke-opacity="0.55"/><text class="chip" x="26" y="14" text-anchor="middle" fill="#7FE9F5">Regex</text></g>
  </g>
  <text class="lnk" x="352" y="256" fill="#22D3EE">Credit Card Parser</text>
  <text class="lnk arr" x="470" y="256" fill="#22D3EE">→</text>
</g>

<!-- ===== CARD 3 : FINANCIAL ML ===== -->
<g>
  <rect x="620" y="40" width="280" height="240" rx="16" fill="url(#panel)" stroke="#233041"/>
  <g clip-path="url(#c3)">
    <ellipse class="cglow cg3" cx="750" cy="70" rx="150" ry="90" fill="url(#rGreen)" opacity="0.5"/>
    <rect class="sweep sweep3" x="620" y="40" width="120" height="240" fill="url(#scan)"/>
  </g>
  <rect x="620" y="40" width="280" height="3.5" fill="url(#gGreen)" filter="url(#barglow)"/>
  <rect x="620" y="40" width="280" height="3.5" rx="2" fill="url(#gGreen)"/>
  <g transform="translate(652,84)">
    <circle class="glow" cx="16" cy="18" r="21" fill="#2E7D32" filter="url(#soft)" opacity="0.55"/>
    <path d="M3 33 V6" stroke="#4ADE80" stroke-width="1.6"/><path d="M3 33 H31" stroke="#4ADE80" stroke-width="1.6"/>
    <polyline class="flow" points="6,28 13,18 19,23 29,8" fill="none" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="29" cy="8" r="3" fill="#fff"/>
  </g>
  <text class="ttl" x="652" y="150">Financial ML</text>
  <text class="sub" x="652" y="172">Federated + time-series</text>
  <text class="sub" x="652" y="189">models for cross-border risk</text>
  <g transform="translate(652,208)">
    <g transform="translate(0,0)"><rect width="60" height="20" rx="6" fill="#2E7D32" opacity="0.2" stroke="#4ADE80" stroke-opacity="0.55"/><text class="chip" x="30" y="14" text-anchor="middle" fill="#9EEBB6">PyTorch</text></g>
    <g transform="translate(66,0)"><rect width="54" height="20" rx="6" fill="#2E7D32" opacity="0.2" stroke="#4ADE80" stroke-opacity="0.55"/><text class="chip" x="27" y="14" text-anchor="middle" fill="#9EEBB6">BiLSTM</text></g>
    <g transform="translate(126,0)"><rect width="56" height="20" rx="6" fill="#2E7D32" opacity="0.2" stroke="#4ADE80" stroke-opacity="0.55"/><text class="chip" x="28" y="14" text-anchor="middle" fill="#9EEBB6">GARCH</text></g>
  </g>
  <text class="lnk" x="652" y="256" fill="#4ADE80">Federated Learning</text>
  <text class="lnk arr" x="770" y="256" fill="#4ADE80">→</text>
</g>
</svg>
