<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" fill="none" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f1620"/><stop offset="1" stop-color="#0b1017"/>
  </linearGradient>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F6FEB"/><stop offset="1" stop-color="#58A6FF"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E7490"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E7D32"/><stop offset="1" stop-color="#4ADE80"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="c1"><rect x="20"  y="40" width="280" height="240" rx="14"/></clipPath>
  <clipPath id="c2"><rect x="320" y="40" width="280" height="240" rx="14"/></clipPath>
  <clipPath id="c3"><rect x="620" y="40" width="280" height="240" rx="14"/></clipPath>
  <style>
    /* Content is visible by default; animation is purely additive so the
       panel degrades to a clean static image on any renderer. */
    text{fill:#e6edf3}
    .sub{fill:#8b949e;font-size:12.5px}
    .ttl{font-size:19px;font-weight:700}
    .chip{font-size:11px;font-weight:600}
    .glow{animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
    .sweep{animation:sweep 6s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-320px)}55%,100%{transform:translateX(320px)}}
    .sweep2{animation-delay:.5s}.sweep3{animation-delay:1s}
    .flow{stroke-dasharray:4 8;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .arr{animation:nudge 1.8s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
  </style>
</defs>

<!-- ===== CARD 1 : RAG & LLM ===== -->
<g class="card k1">
  <rect x="20" y="40" width="280" height="240" rx="14" fill="url(#panel)" stroke="#233041"/>
  <rect x="20" y="40" width="280" height="240" rx="14" fill="url(#gBlue)" opacity="0.06"/>
  <rect class="bar b1" x="20" y="40" width="280" height="4" rx="2" fill="url(#gBlue)"/>
  <g clip-path="url(#c1)"><rect class="sweep" x="20" y="40" width="120" height="240" fill="url(#scan)"/></g>
  <!-- neural icon -->
  <g transform="translate(52,86)">
    <circle class="glow" cx="16" cy="16" r="20" fill="#1F6FEB" filter="url(#soft)" opacity="0.5"/>
    <line class="flow" x1="6" y1="6" x2="26" y2="16" stroke="#58A6FF" stroke-width="1.6"/>
    <line class="flow" x1="6" y1="26" x2="26" y2="16" stroke="#58A6FF" stroke-width="1.6"/>
    <line class="flow" x1="6" y1="6" x2="6" y2="26" stroke="#58A6FF" stroke-width="1.6"/>
    <circle cx="6" cy="6" r="3.4" fill="#58A6FF"/><circle cx="6" cy="26" r="3.4" fill="#58A6FF"/><circle cx="26" cy="16" r="4" fill="#fff"/>
  </g>
  <text class="ttl" x="52" y="150">RAG &amp; LLM Apps</text>
  <text class="sub" x="52" y="172">Hybrid semantic + keyword</text>
  <text class="sub" x="52" y="189">retrieval, grounded answers</text>
  <g transform="translate(52,208)">
    <g transform="translate(0,0)"><g class="chipg g1a"><rect width="46" height="20" rx="5" fill="#1F6FEB" opacity="0.16" stroke="#1F6FEB" stroke-opacity="0.5"/><text class="chip" x="23" y="14" text-anchor="middle" fill="#8EC1FF">RAG</text></g></g>
    <g transform="translate(52,0)"><g class="chipg g1b"><rect width="78" height="20" rx="5" fill="#1F6FEB" opacity="0.16" stroke="#1F6FEB" stroke-opacity="0.5"/><text class="chip" x="39" y="14" text-anchor="middle" fill="#8EC1FF">ChromaDB</text></g></g>
    <g transform="translate(136,0)"><g class="chipg g1c"><rect width="52" height="20" rx="5" fill="#1F6FEB" opacity="0.16" stroke="#1F6FEB" stroke-opacity="0.5"/><text class="chip" x="26" y="14" text-anchor="middle" fill="#8EC1FF">BM25</text></g></g>
  </g>
  <text x="52" y="256" font-size="12.5" font-weight="600" fill="#58A6FF">TemporalLaw-AI  →</text>
</g>

<!-- ===== CARD 2 : DOCUMENT INTELLIGENCE ===== -->
<g class="card k2">
  <rect x="320" y="40" width="280" height="240" rx="14" fill="url(#panel)" stroke="#233041"/>
  <rect x="320" y="40" width="280" height="240" rx="14" fill="url(#gTeal)" opacity="0.06"/>
  <rect class="bar b2" x="320" y="40" width="280" height="4" rx="2" fill="url(#gTeal)"/>
  <g clip-path="url(#c2)"><rect class="sweep sweep2" x="320" y="40" width="120" height="240" fill="url(#scan)"/></g>
  <!-- document icon -->
  <g transform="translate(352,84)">
    <circle class="glow" cx="16" cy="18" r="20" fill="#0E7490" filter="url(#soft)" opacity="0.5"/>
    <path d="M4 2 h16 l8 8 v24 a2 2 0 0 1 -2 2 H4 a2 2 0 0 1 -2 -2 V4 a2 2 0 0 1 2 -2 z" fill="#0b1017" stroke="#22D3EE" stroke-width="1.6"/>
    <path d="M20 2 v8 h8" fill="none" stroke="#22D3EE" stroke-width="1.6"/>
    <line class="flow" x1="7" y1="18" x2="23" y2="18" stroke="#22D3EE" stroke-width="1.6"/>
    <line class="flow" x1="7" y1="25" x2="23" y2="25" stroke="#22D3EE" stroke-width="1.6"/>
  </g>
  <text class="ttl" x="352" y="150">Document Intelligence</text>
  <text class="sub" x="352" y="172">OCR extraction pipelines for</text>
  <text class="sub" x="352" y="189">real-world, scanned PDFs</text>
  <g transform="translate(352,208)">
    <g transform="translate(0,0)"><g class="chipg g2a"><rect width="94" height="20" rx="5" fill="#0E7490" opacity="0.18" stroke="#22D3EE" stroke-opacity="0.5"/><text class="chip" x="47" y="14" text-anchor="middle" fill="#7FE9F5">Tesseract OCR</text></g></g>
    <g transform="translate(100,0)"><g class="chipg g2b"><rect width="46" height="20" rx="5" fill="#0E7490" opacity="0.18" stroke="#22D3EE" stroke-opacity="0.5"/><text class="chip" x="23" y="14" text-anchor="middle" fill="#7FE9F5">Flask</text></g></g>
    <g transform="translate(152,0)"><g class="chipg g2c"><rect width="52" height="20" rx="5" fill="#0E7490" opacity="0.18" stroke="#22D3EE" stroke-opacity="0.5"/><text class="chip" x="26" y="14" text-anchor="middle" fill="#7FE9F5">Regex</text></g></g>
  </g>
  <text x="352" y="256" font-size="12.5" font-weight="600" fill="#22D3EE">Credit Card Parser  →</text>
</g>

<!-- ===== CARD 3 : FINANCIAL ML ===== -->
<g class="card k3">
  <rect x="620" y="40" width="280" height="240" rx="14" fill="url(#panel)" stroke="#233041"/>
  <rect x="620" y="40" width="280" height="240" rx="14" fill="url(#gGreen)" opacity="0.06"/>
  <rect class="bar b3" x="620" y="40" width="280" height="4" rx="2" fill="url(#gGreen)"/>
  <g clip-path="url(#c3)"><rect class="sweep sweep3" x="620" y="40" width="120" height="240" fill="url(#scan)"/></g>
  <!-- chart icon -->
  <g transform="translate(652,84)">
    <circle class="glow" cx="16" cy="18" r="20" fill="#2E7D32" filter="url(#soft)" opacity="0.5"/>
    <path d="M3 33 V6" stroke="#4ADE80" stroke-width="1.6"/><path d="M3 33 H31" stroke="#4ADE80" stroke-width="1.6"/>
    <polyline class="flow" points="6,28 13,18 19,23 29,8" fill="none" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="29" cy="8" r="3" fill="#fff"/>
  </g>
  <text class="ttl" x="652" y="150">Financial ML</text>
  <text class="sub" x="652" y="172">Federated + time-series</text>
  <text class="sub" x="652" y="189">models for cross-border risk</text>
  <g transform="translate(652,208)">
    <g transform="translate(0,0)"><g class="chipg g3a"><rect width="60" height="20" rx="5" fill="#2E7D32" opacity="0.18" stroke="#4ADE80" stroke-opacity="0.5"/><text class="chip" x="30" y="14" text-anchor="middle" fill="#9EEBB6">PyTorch</text></g></g>
    <g transform="translate(66,0)"><g class="chipg g3b"><rect width="54" height="20" rx="5" fill="#2E7D32" opacity="0.18" stroke="#4ADE80" stroke-opacity="0.5"/><text class="chip" x="27" y="14" text-anchor="middle" fill="#9EEBB6">BiLSTM</text></g></g>
    <g transform="translate(126,0)"><g class="chipg g3c"><rect width="56" height="20" rx="5" fill="#2E7D32" opacity="0.18" stroke="#4ADE80" stroke-opacity="0.5"/><text class="chip" x="28" y="14" text-anchor="middle" fill="#9EEBB6">GARCH</text></g></g>
  </g>
  <text x="652" y="256" font-size="12.5" font-weight="600" fill="#4ADE80">Federated Learning  →</text>
</g>
</svg>
