<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 74" width="880" height="74" fill="none" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1620"/><stop offset="1" stop-color="#0b1017"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E7490"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="pscan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="rTop" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0E7490" stop-opacity="0.22"/><stop offset="1" stop-color="#0E7490" stop-opacity="0"/></radialGradient>
  <filter id="bg" x="-10%" y="-500%" width="120%" height="1100%"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="pc"><rect x="1" y="1" width="878" height="72" rx="14"/></clipPath>
  <style>
    .ttl{font-size:18px;font-weight:700;fill:#e6edf3}
    .sub{font-size:14px;fill:#9aa7b4}
    .chip{font-size:11.5px;font-weight:700;fill:#fff}
    .sw{animation:sw 8s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-380px)}55%,100%{transform:translateX(600px)}}
    .tg{animation:tg 5s ease-in-out infinite}@keyframes tg{0%,100%{opacity:.5}50%{opacity:.9}}
  </style>
</defs>
<rect x="1" y="1" width="878" height="72" rx="14" fill="url(#pbg)" stroke="#233041"/>
<g clip-path="url(#pc)">
  <ellipse class="tg" cx="220" cy="4" rx="360" ry="52" fill="url(#rTop)"/>
  <rect class="sw" x="0" y="0" width="150" height="74" fill="url(#pscan)"/>
  <rect x="1" y="1" width="878" height="3.5" fill="url(#acc)" filter="url(#bg)"/>
  <rect x="1" y="1" width="878" height="3.5" fill="url(#acc)"/>
</g>
<g transform="translate(24,13)"><rect x="2" y="5" width="20" height="14" rx="2.5" fill="none" stroke="#3FB8B0" stroke-width="1.8"/><line x1="2.6" y1="9.2" x2="21.4" y2="9.2" stroke="#3FB8B0" stroke-width="3"/><line x1="6" y1="14.5" x2="12" y2="14.5" stroke="#3FB8B0" stroke-width="1.6" stroke-linecap="round"/></g>
<text class="ttl" x="58" y="30">Credit Card Parser</text>
<text class="sub" x="223" y="30">— Statement → Structured Data</text>
<g transform="translate(58,46)"><rect width="45" height="20" rx="6" fill="#3FB8B0" fill-opacity="0.18" stroke="#3FB8B0" stroke-opacity="0.55"/><text class="chip" x="22.5" y="14" text-anchor="middle">Flask</text></g>
<g transform="translate(110,46)"><rect width="94" height="20" rx="6" fill="#3FB8B0" fill-opacity="0.18" stroke="#3FB8B0" stroke-opacity="0.55"/><text class="chip" x="47.0" y="14" text-anchor="middle">Tesseract OCR</text></g>
<g transform="translate(211,46)"><rect width="89" height="20" rx="6" fill="#3FB8B0" fill-opacity="0.18" stroke="#3FB8B0" stroke-opacity="0.55"/><text class="chip" x="44.5" y="14" text-anchor="middle">Document AI</text></g>
</svg>