<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Aditya Ganjoo - Aspiring AI / ML Engineer">
  <defs>
    <radialGradient id="focus" cx="50%" cy="46%" r="52%">
      <stop offset="0%"  stop-color="#0d1117" stop-opacity="0.94"/>
      <stop offset="55%" stop-color="#0d1117" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="330"/></clipPath>
  </defs>

  <style>
    .code text { font-family: ui-monospace,'SF Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace; font-size: 19px; }
    @keyframes su { from{transform:translateY(0)} to{transform:translateY(calc(-1 * var(--h)))} }
    @keyframes sd { from{transform:translateY(calc(-1 * var(--h)))} to{transform:translateY(0)} }
    .scrollUp{ animation: su 34s linear infinite; }
    .scrollDown{ animation: sd 40s linear infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor{ animation: blink 1.05s step-end infinite; }
    .title{ font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#bg)"/>

    <!-- scrolling code background -->
    <g class="code" opacity="0.5">
      <g class="scrollUp" style="--h:364px">
