      <g class="scrollUp" style="--h:364px">
      <text x="48" y="26" fill="#ff7b72">import torch</text>
      <text x="48" y="52" fill="#ff7b72">import torch.nn as nn</text>
      <text x="48" y="104" fill="#d2a8ff">class BiLSTM(nn.Module):</text>
      <text x="48" y="130" fill="#d2a8ff">    def forward(self, x):</text>
      <text x="48" y="156" fill="#adbac7">        h = self.lstm(x)[0]</text>
      <text x="48" y="182" fill="#ff7b72">        return self.fc(h)</text>
      <text x="48" y="234" fill="#adbac7">model = BiLSTM(dim=25)</text>
      <text x="48" y="260" fill="#ff7b72">for epoch in range(EPOCHS):</text>
      <text x="48" y="286" fill="#adbac7">    loss = train(model)</text>
      <text x="48" y="312" fill="#adbac7">    loss.backward()</text>
      <text x="48" y="338" fill="#768390"># federated averaging</text>
      <text x="48" y="364" fill="#adbac7">agg = fed_avg(clients)</text>
      <text x="48" y="390" fill="#ff7b72">import torch</text>
      <text x="48" y="416" fill="#ff7b72">import torch.nn as nn</text>
      <text x="48" y="468" fill="#d2a8ff">class BiLSTM(nn.Module):</text>
      <text x="48" y="494" fill="#d2a8ff">    def forward(self, x):</text>
      <text x="48" y="520" fill="#adbac7">        h = self.lstm(x)[0]</text>
      <text x="48" y="546" fill="#ff7b72">        return self.fc(h)</text>
      <text x="48" y="598" fill="#adbac7">model = BiLSTM(dim=25)</text>
      <text x="48" y="624" fill="#ff7b72">for epoch in range(EPOCHS):</text>
      <text x="48" y="650" fill="#adbac7">    loss = train(model)</text>
      <text x="48" y="676" fill="#adbac7">    loss.backward()</text>
      <text x="48" y="702" fill="#768390"># federated averaging</text>
      <text x="48" y="728" fill="#adbac7">agg = fed_avg(clients)</text>
    </g>
      <g class="scrollDown" style="--h:364px">
      <text x="660" y="26" fill="#ff7b72">from chromadb import Client</text>
      <text x="660" y="52" fill="#d2a8ff">def retrieve(query, k=5):</text>
      <text x="660" y="78" fill="#adbac7">    hits = bm25.search(q, k)</text>
      <text x="660" y="104" fill="#adbac7">    dense = embed(query)</text>
      <text x="660" y="130" fill="#ff7b72">    return rerank(hits)</text>
      <text x="660" y="182" fill="#adbac7">docs = chroma.query(text)</text>
      <text x="660" y="208" fill="#adbac7">ctx = join(docs)</text>
      <text x="660" y="234" fill="#adbac7">answer = llm.generate(ctx)</text>
      <text x="660" y="286" fill="#d2a8ff">@app.route('/predict')</text>
      <text x="660" y="312" fill="#d2a8ff">def predict(pdf):</text>
      <text x="660" y="338" fill="#ff7b72">    return ocr.extract(pdf)</text>
      <text x="660" y="364" fill="#768390"># grounded + cited</text>
      <text x="660" y="390" fill="#ff7b72">from chromadb import Client</text>
      <text x="660" y="416" fill="#d2a8ff">def retrieve(query, k=5):</text>
      <text x="660" y="442" fill="#adbac7">    hits = bm25.search(q, k)</text>
      <text x="660" y="468" fill="#adbac7">    dense = embed(query)</text>
      <text x="660" y="494" fill="#ff7b72">    return rerank(hits)</text>
      <text x="660" y="546" fill="#adbac7">docs = chroma.query(text)</text>
      <text x="660" y="572" fill="#adbac7">ctx = join(docs)</text>
      <text x="660" y="598" fill="#adbac7">answer = llm.generate(ctx)</text>
      <text x="660" y="650" fill="#d2a8ff">@app.route('/predict')</text>
      <text x="660" y="676" fill="#d2a8ff">def predict(pdf):</text>
      <text x="660" y="702" fill="#ff7b72">    return ocr.extract(pdf)</text>
