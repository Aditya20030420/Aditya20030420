<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 113 40" width="113" height="40" fill="none" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#35B85B"/><stop offset="1" stop-color="#1C8C41"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/></filter>
  <style>.fl{transform-box:fill-box;transform-origin:center;animation:f 3.6s ease-in-out infinite}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}</style>
