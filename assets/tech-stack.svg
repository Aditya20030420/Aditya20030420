  <clipPath id="pclip"><rect x="1" y="1" width="878" height="222" rx="15"/></clipPath>
  <style>
    text{fill:#e6edf3}
    .cat{font-size:14px;font-weight:700}
    .chip{font-size:11.5px;font-weight:700;fill:#fff}
    .psweep{animation:psw 8s ease-in-out infinite}
    @keyframes psw{0%{transform:translateX(-380px)}55%,100%{transform:translateX(600px)}}
    .tglow{animation:tg 5s ease-in-out infinite}
    @keyframes tg{0%,100%{opacity:.5}50%{opacity:.9}}
  </style>
</defs>
